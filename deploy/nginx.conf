# Example nginx TLS termination for dropfu.
# Place certs via scripts/gen_certs.sh or a real CA.

upstream dropfu_client {
    server 127.0.0.1:8443;
}

upstream dropfu_agent {
    server 127.0.0.1:9443;
}

server {
    listen 443 ssl http2;
    server_name dropfu.example;

    ssl_certificate     /etc/dropfu/cert.pem;
    ssl_certificate_key /etc/dropfu/key.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /ws {
        proxy_pass http://dropfu_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
    }

    location /login {
        proxy_pass http://dropfu_client;
        proxy_set_header Host $host;
    }

    location /plugins/ {
        proxy_pass http://dropfu_client;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /health {
        proxy_pass http://dropfu_client;
    }

    location / {
        root /var/www/dropfu;
        try_files $uri /index.html;
    }
}

server {
    listen 9443 ssl http2;
    server_name agents.example;

    ssl_certificate     /etc/dropfu/cert.pem;
    ssl_certificate_key /etc/dropfu/key.pem;

    location / {
        proxy_pass http://dropfu_agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
    }
}

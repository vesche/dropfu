[project]
name = "dropfu-plugins"
version = "1.0.0"
description = "Cross-platform incident response plugins for dropfu-agent"
requires-python = ">=3.14,<3.15"
dependencies = [
    "filetype==1.2.0",
    "ifaddr==0.2.0",
    "ping3==4.0.8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

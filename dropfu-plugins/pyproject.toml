[project]
name = "dropfu-plugins"
version = "1.0.0"
description = "Cross-platform incident response plugins for dropfu-agent"
requires-python = ">=3.10"
dependencies = [
    "psutil",
    "filetype",
    "ifaddr",
    "ping3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"
